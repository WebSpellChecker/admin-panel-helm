# Example Secret for `secrets.existingSecret: admin-panel-secrets`.
# Apply before installing the chart:
#   kubectl -n wsc apply -f docs/examples/secret.yaml
#
# Replace every required placeholder. Do not commit real credentials. In production,
# create this Secret through your secret-management workflow.
apiVersion: v1
kind: Secret
metadata:
  name: admin-panel-secrets
  namespace: wsc
type: Opaque
stringData: # Kubernetes encodes these plain-text values.
  # Required
  # Generate with: printf 'base64:%s\n' "$(openssl rand -base64 32)"
  APP_KEY: "base64:REPLACE_ME"
  DB_PASSWORD: REPLACE_ME # Admin-panel database password
  SERVICE_DB_PASSWORD: REPLACE_ME # WProofreader service database password

  # Add optional keys only when the feature is enabled. See
  # docs/ENVIRONMENT_VARIABLES.md for SMTP, S3, OAuth, and other keys.
