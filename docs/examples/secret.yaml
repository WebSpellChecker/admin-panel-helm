# Pre-created Secret consumed through `secrets.existingSecret`.
#
# When `secrets.existingSecret: admin-panel-secrets` is set, the chart does not create a Secret
# of its own; this object must hold every SECRET env key the app needs. It is loaded
# alongside the chart-generated ConfigMap (non-secret env), so it holds secrets ONLY.
#
# Apply before installing the chart:
#   kubectl -n admin-panel apply -f secret.yaml
#
# Never commit real production values. Manage them with Sealed Secrets, SOPS, or Vault.
apiVersion: v1
kind: Secret
metadata:
  name: admin-panel-secrets
  namespace: admin-panel
type: Opaque
stringData:                          # plain text; Kubernetes base64-encodes it for you
  # --- required ---
  APP_KEY: "base64:REPLACE_ME"       # generate with: printf 'base64:%s\n' "$(openssl rand -base64 32)"
  DB_PASSWORD: REPLACE_ME            # primary (admin_panel) DB password
  SERVICE_DB_PASSWORD: REPLACE_ME    # WProofreader (cloud_service) DB password

  # Add optional keys only when the feature is enabled. See
  # docs/ENVIRONMENT_VARIABLES.md for SMTP, S3, OAuth, and other keys.
