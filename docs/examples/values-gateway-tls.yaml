# Gateway API routing with cert-manager TLS. WProofreader uses the same host.
#
# This example uses Traefik with listener ports 8000 and 8443. For Envoy Gateway, use:
#   gatewayClassName: eg, listenerPort: 80, tls.listenerPort: 443
# See docs/ROUTING.md for requirements and verification.
config:
  appUrl: https://admin-panel.example.com
  appServerUrl: https://admin-panel.example.com/wscservice/api # same-origin routing
  # Optional in-cluster URL for license checks and service management.
  appServerInternalUrl: http://wproofreader-app.wsc.svc.cluster.local/wscservice/api

  db:
    host: mysql.example.com
    port: 3306
    database: admin_panel_db
    username: admin_panel
  serviceDb:
    host: wproofreader-mysql.example.com
    port: 3306
    database: cloud_service
    username: app_service
  mail:
    mailer: log # replace with SMTP settings before production

secrets:
  existingSecret: admin-panel-secrets # APP_KEY, database passwords, OAuth, and mail

gateway:
  enabled: true
  create: true
  gatewayClassName: traefik
  listenerPort: 8000
  hostnames: ["admin-panel.example.com"]
  tls:
    enabled: true
    listenerPort: 8443
    secretName: admin-panel-gw-tls
    certManager: # the chart creates the Certificate
      enabled: true
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer
  wproofreader:
    enabled: true
    serviceName: wproofreader-app
    servicePort: 80
    # Set namespace when WProofreader runs in a different namespace.
    # namespace: wproofreader
