# Reference only. Do not apply this file.
# The chart creates `<release>-env` from the `config.*` values. Inspect the live object:
#   kubectl -n wsc get configmap admin-panel-env -o yaml
#
# Use `config.extraEnv` for additional non-secret variables. Use
# `secrets.extraSecretEnv` for additional secret variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-panel-env
  namespace: wsc
data:
  # Core
  APP_NAME: "Admin-panel"
  APP_ENV: "production"
  APP_URL: "https://admin-panel.example.com"
  LOG_OUTPUT_LEVEL: "info"
  # WProofreader AppServer
  APP_SERVER_URL: "https://wproofreader.example.com/wscservice/api"
  # Include this key only when config.appServerInternalUrl is set.
  APP_SERVER_INTERNAL_URL: "http://wproofreader-app.wsc.svc.cluster.local/wscservice/api"
  # nginx and proxy
  SSL_MODE: "off" # TLS terminates at the Ingress or Gateway
  PROXY_TYPE: "generic"
  # Drivers
  SESSION_DRIVER: "database"
  CACHE_STORE: "database"
  QUEUE_CONNECTION: "database"
  FILESYSTEM_DISK: "local"
  JETSTREAM_PROFILE_PHOTO_DISK: "public"
  # Primary database. The password is in the Secret.
  DB_HOST: "mysql.example.com"
  DB_PORT: "3306"
  DB_DATABASE: "admin_panel_db"
  DB_USERNAME: "admin_panel"
  # WProofreader service database. The password is in the Secret.
  SERVICE_DB_HOST: "wproofreader-mysql.example.com"
  SERVICE_DB_PORT: "3306"
  SERVICE_DB_DATABASE: "cloud_service"
  SERVICE_DB_USERNAME: "app_service"
  # Mail
  MAIL_MAILER: "smtp"
  MAIL_HOST: "smtp.example.com"
  MAIL_PORT: "587"
  MAIL_ENCRYPTION: "tls"
  MAIL_FROM_ADDRESS: "hello@example.com"
  MAIL_FROM_NAME: "Admin-panel"

# Add custom variables through the values file:
#
#   config:
#     extraEnv:
#       MY_FLAG: "1"
#   secrets:
#     extraSecretEnv:
#       MY_TOKEN: "s3cr3t"
