# Traefik Ingress routing with cert-manager TLS. WProofreader uses the same host.
# Configure the HTTP-to-HTTPS redirect on the Traefik entrypoint. See docs/ROUTING.md.
# Ingress requires WProofreader and Admin-panel in the same namespace.
config:
  appUrl: https://admin-panel.example.com
  appServerUrl: https://admin-panel.example.com/wscservice/api
  # Optional in-cluster URL for license checks and service management.
  appServerInternalUrl: http://wproofreader-app.wsc.svc.cluster.local/wscservice/api

  db:
    host: mysql.example.com
    port: 3306
    database: admin_panel_db
    username: admin_panel
  serviceDb:
    host: wproofreader-mysql.example.com
    port: 3306
    database: cloud_service
    username: app_service
  mail:
    mailer: log # replace with SMTP settings before production

secrets:
  existingSecret: admin-panel-secrets

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: admin-panel.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: admin-panel-tls
      hosts: ["admin-panel.example.com"]
  wproofreader:
    enabled: true
    serviceName: wproofreader-app
    servicePort: 80
