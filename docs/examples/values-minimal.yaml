# Minimal Admin-panel installation with external MySQL and no routing.
# Copy this file to values.local.yaml. Replace the example endpoints, then follow
# docs/QUICKSTART.md. Store passwords in the admin-panel-secrets Secret.
config:
  appUrl: http://127.0.0.1:8080 # matches the quick-start port-forward
  appServerUrl: https://wproofreader.example.com/wscservice/api
  appServerInternalUrl: http://wproofreader-app.wsc.svc.cluster.local/wscservice/api

  db:
    host: mysql.example.com
    port: 3306
    database: admin_panel_db
    username: admin_panel

  # WProofreader owns this database. Admin-panel only connects to it.
  serviceDb:
    host: wproofreader-mysql.example.com
    port: 3306
    database: cloud_service
    username: app_service

  # Write mail to the application log until SMTP is configured.
  mail:
    mailer: log

secrets:
  existingSecret: admin-panel-secrets
