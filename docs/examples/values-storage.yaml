# Durable storage for profile photos and uploads.
# This overlay enables S3 by default. To use a shared volume, remove the S3 settings
# and enable the commented persistence settings.

# Option A: S3-compatible object storage
config:
  profilePhotoDisk: s3
  filesystemDisk: s3
  objectStorage:
    endpoint: http://minio.minio.svc:9000 # leave empty for Amazon S3
    region: us-east-1
    bucket: admin-panel
    usePathStyleEndpoint: true # required by MinIO and Ceph
# Add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY to the existing Secret when the
# platform does not supply credentials through workload identity.

# Option B: shared ReadWriteMany volume
# Remove the config block above. Then uncomment this block and set the StorageClass.
# persistence:
#   enabled: true
#   storageClass: nfs-client
#   accessModes: ["ReadWriteMany"]
#   size: 5Gi
