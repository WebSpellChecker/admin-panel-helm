{{- if and .Values.web.enabled .Values.web.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "admin-panel.componentName" (list . "web") }}
  labels:
    {{- include "admin-panel.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- with .Values.web.podDisruptionBudget }}
  {{- if not (kindIs "invalid" .maxUnavailable) }}
  maxUnavailable: {{ .maxUnavailable }}
  {{- else }}
  minAvailable: {{ .minAvailable }}
  {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "admin-panel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
{{- end }}
