{{/*
Secret env (key/values), shared by the runtime Secret and the migrate-hook Secret.
Only rendered when secrets.existingSecret is unset (otherwise the user-provided
Secret is used directly).
*/}}
{{- define "admin-panel.secretEnvData" -}}
{{- $reserved := dict "APP_KEY" true "DB_PASSWORD" true "SERVICE_DB_PASSWORD" true "MAIL_USERNAME" true "MAIL_PASSWORD" true "AWS_ACCESS_KEY_ID" true "AWS_SECRET_ACCESS_KEY" true -}}
{{- range $key := keys .Values.secrets.extraSecretEnv -}}
{{- if hasKey $reserved $key -}}
{{- fail (printf "secrets.extraSecretEnv.%s is managed by the chart; set its documented chart value instead" $key) -}}
{{- end -}}
{{- end -}}
{{- if not .Values.secrets.appKey }}
{{- fail "secrets.appKey is required (Laravel needs APP_KEY for encryption/sessions in every environment). Generate one with: php artisan key:generate --show, or set secrets.existingSecret." }}
{{- end }}
{{- with .Values.secrets.appKey }}
APP_KEY: {{ . | quote }}
{{- end }}
# --- Database ---
{{- with .Values.secrets.db.password }}
DB_PASSWORD: {{ . | quote }}
{{- end }}
{{- with .Values.secrets.serviceDb.password }}
SERVICE_DB_PASSWORD: {{ . | quote }}
{{- end }}
# --- Mail ---
{{- with .Values.secrets.mail.username }}
MAIL_USERNAME: {{ . | quote }}
{{- end }}
{{- with .Values.secrets.mail.password }}
MAIL_PASSWORD: {{ . | quote }}
{{- end }}
# --- S3-compatible storage credentials (MinIO/Ceph/AWS; omit with AWS IRSA) ---
{{- with .Values.secrets.s3.accessKeyId }}
AWS_ACCESS_KEY_ID: {{ . | quote }}
{{- end }}
{{- with .Values.secrets.s3.secretAccessKey }}
AWS_SECRET_ACCESS_KEY: {{ . | quote }}
{{- end }}
{{- range $k, $v := .Values.secrets.extraSecretEnv }}
{{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "admin-panel.secretName" . }}
  labels:
    {{- include "admin-panel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- include "admin-panel.secretEnvData" . | nindent 2 }}
{{- end }}
