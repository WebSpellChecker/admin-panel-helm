{{- if .Values.ingress.enabled }}
{{- if not .Values.web.enabled }}
{{- fail "ingress.enabled requires web.enabled because the Ingress points to the web Service." }}
{{- end }}
{{- $fullName := include "admin-panel.fullname" . -}}
{{- $webName := include "admin-panel.componentName" (list . "web") -}}
{{- $svcPort := .Values.web.service.port -}}
{{- $wpr := .Values.ingress.wproofreader -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "admin-panel.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- if $wpr.enabled }}
          {{- range $wpr.paths }}
          - path: {{ . }}
            pathType: {{ $wpr.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $wpr.serviceName }}
                port:
                  number: {{ $wpr.servicePort }}
          {{- end }}
          {{- end }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $webName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
