{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "admin-panel.componentName" (list . "migrate") }}
  labels:
    {{- include "admin-panel.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": {{ .Values.migrations.hooks | quote }}
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "admin-panel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- include "admin-panel.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      serviceAccountName: {{ include "admin-panel.migrateServiceAccountName" . }}
      restartPolicy: Never
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "admin-panel.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # CMD is replaced by a no-op: the image ENTRYPOINT runs its scripts, and
          # because LARAVEL_PROVISION_ADMIN_PANEL_DB=true it waits for the DB and runs
          # `php artisan migrate --force` (and db:seed when enabled) using the
          # already-tested provisioning path, then the container exits 0.
          args: ["true"]
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            {{- include "admin-panel.migrateEnvFrom" . | nindent 12 }}
          env:
            - name: LARAVEL_PROVISION_ADMIN_PANEL_DB
              value: "true"
            - name: LARAVEL_SEED_ADMIN_PANEL_DB
              value: {{ .Values.migrations.runSeed | quote }}
            - name: LARAVEL_MIGRATION_WAIT_DB_TIMEOUT
              value: {{ .Values.migrations.waitDbTimeout | quote }}
            - name: SKIP_WEBSERVER_CONFIGURATION
              value: "true"
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.migrations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
