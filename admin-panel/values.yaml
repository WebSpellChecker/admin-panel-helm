# =============================================================================
# Admin-panel Helm chart values
# =============================================================================
# Design principles:
#   * One image, three roles: web (nginx+php-fpm), worker (queue), scheduler.
#     Only web runs the image entrypoint; worker and scheduler start their
#     artisan command directly (SKIP_ENTRYPOINT_CONFIG=true), like the Docker
#     Compose example. Requires Admin-panel 3.0.0 or newer.
#   * Provider-agnostic: portable defaults; databases and other services stay external.
#   * Migrations run once via a Helm hook Job, never per pod.
#   * Routing (Gateway API / Ingress) is opt-in, both disabled by default.
# =============================================================================

# -- Override the chart name used for resource names and the app.kubernetes.io/name label.
nameOverride: ""
# -- Override the fully-qualified release name used for resource names.
fullnameOverride: ""

image:
  # -- Image registry. Empty uses the repository as-is (Docker Hub).
  registry: "docker.io"
  # -- Application image repository.
  repository: webspellchecker/admin-panel
  # -- Image tag. Defaults to the chart appVersion when empty.
  tag: ""
  # -- Image digest, for example sha256:abc123. When set, this takes precedence over tag.
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Pull secrets for private registries or mirrored images. For example, [{ name: regcred }].
imagePullSecrets: []

# =============================================================================
# Non-secret application configuration (rendered into a ConfigMap, injected as env)
# =============================================================================
config:
  # -- Application display name.
  appName: "Admin-panel"
  # -- Laravel environment (production|staging|local).
  appEnv: production
  # -- (string, required) Public application URL. It must match the hostname served by the Ingress or Gateway.
  appUrl: ""
  # -- (string, required) Public WProofreader AppServer API URL.
  appServerUrl: ""
  # -- Optional in-cluster WProofreader AppServer URL. When empty, the application uses appServerUrl.
  appServerInternalUrl: ""
  # -- Container log verbosity (debug|info|warn|error).
  logOutputLevel: info
  # -- nginx SSL mode. Keep "off" when TLS terminates at the Ingress or Gateway.
  sslMode: "off"
  # -- Real-IP/proxy profile (generic|aws|cloudflare).
  proxyType: "generic"

  # -- Session driver. Use database when you run more than one web replica.
  sessionDriver: database
  # -- Cache store. The database option needs no additional service.
  cacheStore: database
  # -- Queue connection. The database option needs no additional service.
  queueConnection: database
  # -- Default filesystem disk (local|s3). Use s3 for shared storage across replicas.
  filesystemDisk: local
  # -- Jetstream profile-photo disk (public|s3). Use s3 for persistent, shared files.
  profilePhotoDisk: public

  # Primary database (non-secret parts; password lives under secrets.db.password).
  db:
    # -- (string, required) Primary DB host or Kubernetes Service name.
    host: ""
    # -- Primary DB port.
    port: 3306
    # -- Primary DB name.
    database: admin_panel_db
    # -- Primary DB username.
    username: admin_panel

  # Service database. WProofreader owns and provisions this database.
  # These are connection details only, pointing at WProofreader's MySQL.
  # An empty host uses the primary database host. Set a separate host in production.
  serviceDb:
    # -- Service DB host. When empty, the application uses config.db.host.
    host: ""
    # -- Service DB port.
    port: 3306
    # -- Service DB name.
    database: app_service_db
    # -- Service DB username. Set it when serviceDb.host differs from db.host.
    username: ""

  # Mail (non-secret parts; credentials under secrets.mail.*).
  mail:
    # -- Mailer transport.
    mailer: smtp
    # -- SMTP host.
    host: ""
    # -- SMTP port.
    port: 587
    # -- Compatibility value for SMTP encryption. The port controls the TLS mode.
    encryption: tls
    # -- From address.
    fromAddress: "hello@example.com"
    # -- From name.
    fromName: "Admin-panel"

  # Object storage over the S3 API (used when filesystemDisk/profilePhotoDisk = s3).
  # Provider-agnostic: point `endpoint` at any S3-compatible store, for example MinIO or
  # Ceph RGW (set endpoint + usePathStyleEndpoint: true). Leave endpoint empty only for
  # Amazon S3, which then uses its regional endpoint. The AWS_* env names come from the
  # Laravel S3 driver and apply to every S3-compatible store.
  objectStorage:
    # -- AWS_DEFAULT_REGION.
    region: ""
    # -- Bucket name.
    bucket: ""
    # -- S3 API endpoint. When empty, the S3 client uses the Amazon S3 regional endpoint.
    endpoint: ""
    # -- Use path-style addressing when endpoint is set. Enable it for MinIO or Ceph.
    usePathStyleEndpoint: true

  # -- Additional non-secret environment variables. For example, { FOO: "bar" }.
  extraEnv: {}

# =============================================================================
# Secret values (rendered into a Secret unless existingSecret is set)
# =============================================================================
secrets:
  # -- Use an existing Secret. When set, the chart ignores the secret values below.
  existingSecret: ""

  # -- Laravel APP_KEY for a chart-managed Secret. Put APP_KEY in existingSecret when you use one.
  appKey: ""

  db:
    # -- Primary DB password (provide here, or via existingSecret).
    password: ""
  serviceDb:
    # -- Service DB password. Set it when serviceDb.host differs from db.host.
    password: ""
  mail:
    # -- SMTP username.
    username: ""
    # -- SMTP password.
    password: ""
  # S3-compatible object storage credentials for any S3 API (MinIO, Ceph RGW, Amazon S3).
  # Leave both empty when your platform supplies credentials through workload identity.
  s3:
    # -- S3 access key id. Empty when workload identity supplies credentials.
    accessKeyId: ""
    # -- S3 secret access key. Empty when workload identity supplies credentials.
    secretAccessKey: ""

  # -- Additional secret environment variables.
  extraSecretEnv: {}

# =============================================================================
# Shared persistent storage (optional), an alternative to S3 for avatars and uploads
# =============================================================================
# A ReadWriteMany volume at storage/app persists files and shares them between roles.
# Use this option or use S3. The StorageClass must support ReadWriteMany access.
persistence:
  # -- Create and mount a shared PVC for uploads and profile photos.
  enabled: false
  # -- Use an existing PVC. When set, the chart ignores storageClass, accessModes, and size.
  existingClaim: ""
  # -- StorageClass for the created PVC. When empty, Kubernetes uses the cluster default.
  storageClass: ""
  # -- Access modes. ReadWriteMany is required to share across replicas/nodes.
  accessModes: ["ReadWriteMany"]
  # -- Requested volume size.
  size: 5Gi
  # -- Container mount path. The default covers the local and public Laravel disks.
  mountPath: /var/www/html/storage/app
  # -- Extra annotations on the created PVC.
  annotations: {}

# =============================================================================
# Service account
# =============================================================================
serviceAccount:
  # -- Create a ServiceAccount.
  create: true
  # -- ServiceAccount name (defaults to the fullname).
  name: ""
  # -- Mount a projected ServiceAccount token. Leave disabled unless the application needs one.
  automountServiceAccountToken: false
  # -- Annotations for the ServiceAccount.
  annotations: {}

# -- Pod annotations applied to all roles.
podAnnotations: {}
# -- Pod labels applied to all roles.
podLabels: {}

# -- Pod-level security context (fsGroup matches www-data uid/gid 33).
podSecurityContext:
  fsGroup: 33
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context (runs non-root as www-data).
securityContext:
  runAsNonRoot: true
  runAsUser: 33
  runAsGroup: 33
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # readOnlyRootFilesystem: false  # app writes to storage/ and bootstrap/cache

# -- HTTP probe targets for PHP-FPM and the Laravel application.
probes:
  # PHP-FPM liveness ping used by startup and liveness probes.
  path: /php-fpm-ping
  port: 8080
  # Laravel health endpoint (registered via bootstrap/app.php health: '/up').
  appPath: /up

# =============================================================================
# Web role: nginx and PHP-FPM
# =============================================================================
web:
  # -- Enable the web Deployment and Service.
  enabled: true
  # -- Number of web replicas. Increase this only after you externalize sessions and storage.
  replicaCount: 1
  # -- Override the image CMD. An empty list uses the default web stack.
  args: []
  # -- Extra env for the web role only.
  extraEnv: {}
  service:
    # -- Service type.
    type: ClusterIP
    # -- Service port (forwards to the container HTTP port).
    port: 80
  # -- Resource requests and limits for the web container.
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    # -- Enable HPA for the web role.
    enabled: false
    # -- Minimum number of web replicas.
    minReplicas: 2
    # -- Maximum number of web replicas.
    maxReplicas: 6
    # -- Target average CPU use as a percentage of the resource request.
    targetCPUUtilizationPercentage: 70
    # targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    # -- Enable a PodDisruptionBudget for the web role.
    enabled: false
    # -- Minimum number of available web Pods. Ignored when maxUnavailable is set.
    minAvailable: 1
  # -- Rolling-update strategy for the web Deployment.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # -- Probe timing overrides (path/port come from .Values.probes).
  livenessProbe: { initialDelaySeconds: 30, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 3 }
  # -- Readiness-probe timing.
  readinessProbe: { initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
  # -- Startup-probe timing.
  startupProbe: { periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 40 }
  # -- Node selector for web Pods.
  nodeSelector: {}
  # -- Tolerations for web Pods.
  tolerations: []
  # -- Affinity rules for web Pods.
  affinity: {}

# =============================================================================
# Worker role: queue:work
# =============================================================================
# NOTE: 'args' (not 'command') is overridden, so the image ENTRYPOINT still runs;
# with SKIP_ENTRYPOINT_CONFIG=true it bypasses the configuration scripts (env
# validation, nginx setup, migrations, cache rebuild) and execs the queue worker.
worker:
  # -- Enable the worker Deployment.
  enabled: true
  # -- Worker replicas.
  replicaCount: 1
  # -- Override the worker CMD.
  args: ["php", "artisan", "queue:work", "--queue=default", "--verbose", "--sleep=3", "--tries=3", "--max-time=3600"]
  # -- Extra env for the worker role only.
  extraEnv: {}
  # -- Resource requests and limits for the worker container.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # -- Graceful shutdown window: queue:work finishes the job in hand on SIGTERM.
  terminationGracePeriodSeconds: 300
  # -- Liveness-probe timing. The probe runs `pgrep -f "artisan queue:work"`.
  livenessProbe: { initialDelaySeconds: 15, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3 }
  # -- Node selector for worker Pods.
  nodeSelector: {}
  # -- Tolerations for worker Pods.
  tolerations: []
  # -- Affinity rules for worker Pods.
  affinity: {}

# =============================================================================
# Scheduler role: schedule:work. The chart always runs one replica.
# =============================================================================
scheduler:
  # -- Enable the scheduler Deployment.
  enabled: true
  # -- Override the scheduler CMD.
  args: ["php", "artisan", "schedule:work"]
  # -- Grace period for the running scheduled task to finish on shutdown/rollout.
  terminationGracePeriodSeconds: 30
  # -- Extra env for the scheduler role only.
  extraEnv: {}
  # -- Resource requests and limits for the scheduler container.
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }
  # -- Liveness-probe timing. The probe runs `pgrep -f "artisan schedule:work"`.
  livenessProbe: { initialDelaySeconds: 15, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3 }
  # -- Node selector for scheduler Pods.
  nodeSelector: {}
  # -- Tolerations for scheduler Pods.
  tolerations: []
  # -- Affinity rules for scheduler Pods.
  affinity: {}

# =============================================================================
# Database migrations (Helm hook Job)
# =============================================================================
# Reuses the image's tested provisioning path: sets LARAVEL_PROVISION_ADMIN_PANEL_DB=true
# and runs a no-op command so the entrypoint waits for the DB, migrates, then exits.
# The variable names are the 3.0.0 ones; older images ignore them and skip migrations.
migrations:
  # -- Run the migration hook Job.
  enabled: true
  # -- Run db:seed whenever the migration hook runs.
  runSeed: false
  # -- Job backoffLimit (retries).
  backoffLimit: 3
  # -- Seconds the entrypoint waits for the DB before failing.
  waitDbTimeout: 120
  # -- Helm hook phases for the migration Job. Keep pre-install and pre-upgrade.
  hooks: "pre-install,pre-upgrade"
  # -- Resource requests and limits for the migration container.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # -- Node selector for the migration Job.
  nodeSelector: {}
  # -- Tolerations for the migration Job.
  tolerations: []
  # -- Affinity rules for the migration Job.
  affinity: {}

# =============================================================================
# Routing is disabled by default. Enable at most one method.
# Gateway API is the primary/recommended path; Ingress is the compatibility option.
# =============================================================================
gateway:
  # -- Enable the Gateway API HTTPRoute.
  enabled: false
  # -- Create a Gateway. When false, parentRefs must identify an existing Gateway.
  create: false
  # -- GatewayClass name. Used only when create is true.
  gatewayClassName: ""
  # -- HTTP listener port for a chart-managed Gateway.
  listenerPort: 80
  # -- HTTPS listener settings for TLS termination at the Gateway.
  tls:
    enabled: false
    listenerPort: 443
    secretName: ""
    # -- Redirect HTTP to HTTPS with status 301. Used only for a chart-managed Gateway.
    httpsRedirect: true
    # -- Create a cert-manager Certificate in the release namespace.
    certManager:
      enabled: false
      issuerRef:
        name: ""              # e.g. selfsigned (dev) | letsencrypt-prod
        kind: ClusterIssuer   # ClusterIssuer | Issuer
  # -- References to an existing Gateway. Used only when create is false.
  parentRefs: []
  # -- Hostnames for the route.
  hostnames: ["admin-panel.example.com"]
  # -- Extra annotations on the HTTPRoute.
  annotations: {}
  # -- Route WProofreader paths on the Admin-panel hostname.
  wproofreader:
    enabled: false
    serviceName: wproofreader-app
    servicePort: 80
    # -- Namespace of the WProofreader Service. Empty uses the release namespace.
    namespace: ""
    # path prefixes routed to WProofreader (most specific first)
    paths: ["/wscservice/api", "/wscservice"]

ingress:
  # -- Enable an Ingress (compatibility option for clusters not on Gateway API).
  enabled: false
  # -- IngressClass name (nginx|traefik|alb).
  className: ""
  # -- Ingress annotations for cert-manager and controller-specific settings.
  annotations: {}
  # -- Hosts and paths (admin-panel backend).
  hosts:
    - host: admin-panel.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS settings.
  tls: []
  # -- Route WProofreader paths on each Admin-panel host.
  wproofreader:
    enabled: false
    serviceName: wproofreader-app
    servicePort: 80
    # pathType for the WProofreader routes. Prefix works on all controllers. For regex
    # paths set ImplementationSpecific AND add your controller's regex annotation via
    # ingress.annotations (the chart does not inject it), e.g. nginx needs
    # nginx.ingress.kubernetes.io/use-regex: "true".
    pathType: Prefix
    # path prefixes routed to WProofreader (most specific first)
    paths: ["/wscservice/api", "/wscservice"]

# =============================================================================
# Optional extras
# =============================================================================
networkPolicy:
  # -- Create a NetworkPolicy for inbound web traffic. Egress remains open.
  enabled: false
  # -- Sources that can reach the web port. An empty list allows all cluster Pods.
  ingressFrom: []
