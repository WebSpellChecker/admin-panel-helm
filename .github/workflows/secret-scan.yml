name: Secret scan

# Fails the build if a secret is committed. Runs on every PR and on pushes to the
# integration branches.
on:
  pull_request:
  push:
    branches: [development, master, main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so gitleaks/trufflehog scan all commits

      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.18.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose

      - name: trufflehog (verified live credentials)
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin" v3.91.0
          "$RUNNER_TEMP/bin/trufflehog" git "file://$GITHUB_WORKSPACE" \
            --only-verified --fail --no-update
